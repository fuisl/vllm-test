services:
  # ─── Embedding ───────────────────────────────────────────────────────────────
  vllm-embed:
    image: vllm/vllm-openai:latest
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    ports:
      - "8000:8000"
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    ipc: host
    command: >
      --model AITeamVN/Vietnamese_Embedding_V2
      --task embed
      --host 0.0.0.0
      --port 8000
      --gpu-memory-utilization 0.08
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  # ─── Reranker ────────────────────────────────────────────────────────────────
  vllm-rerank:
    image: vllm/vllm-openai:latest
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    ports:
      - "8001:8001"
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    ipc: host
    command: >
      --model AITeamVN/Vietnamese_Reranker
      --task score
      --host 0.0.0.0
      --port 8001
      --gpu-memory-utilization 0.08
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  # ─── LLM (Agent 1 + Agent 3 + metadata extraction) ──────────────────────────
  vllm-llm:
    image: vllm/vllm-openai:latest
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    ports:
      - "8002:8002"
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    ipc: host
    command: >
      --model ${LLM_MODEL:-Qwen/Qwen3-8B}
      --host 0.0.0.0
      --port 8002
      --gpu-memory-utilization 0.50
      --max-model-len 32768
      --enable-chunked-prefill
      --kv-cache-dtype fp8
      --enable-reasoning
      --reasoning-parser deepseek_r1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  # ─── Rerank format adapter (Cohere → vLLM /v1/score) ────────────────────────
  rerank-adapter:
    build:
      context: .
      dockerfile: Dockerfile.adapter
    ports:
      - "8003:8003"
    environment:
      - VLLM_RERANK_URL=http://vllm-rerank:8001/v1/score
    depends_on:
      - vllm-rerank
    restart: unless-stopped

  # ─── Nginx proxy (all services unified on :8080) ─────────────────────────────
  proxy:
    image: nginx:alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - vllm-embed
      - vllm-rerank
      - vllm-llm
      - rerank-adapter
    restart: unless-stopped
