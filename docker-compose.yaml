services:
  vllm-embed:
    image: vllm/vllm-openai:latest
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    ports:
      - "8000:8000"
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    ipc: host
    command: >
      --model AITeamVN/Vietnamese_Embedding_V2
      --task embed
      --host 0.0.0.0
      --port 8000
      --gpu-memory-utilization 0.15
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  vllm-rerank:
    image: vllm/vllm-openai:latest
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    ports:
      - "8001:8001"
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    ipc: host
    command: >
      --model AITeamVN/Vietnamese_Reranker
      --task score
      --host 0.0.0.0
      --port 8001
      --gpu-memory-utilization 0.15
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  vllm-chat:
    image: vllm/vllm-openai:latest
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - VLLM_USE_TRITON_FLASH_ATTENTION=0
    ports:
      - "8002:8002"
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    ipc: host
    command: >
      --model Qwen/Qwen3-8B
      --host 0.0.0.0
      --port 8002
      --gpu-memory-utilization 0.60
      --max-model-len 32768
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  rerank-adapter:
    build:
      context: .
      dockerfile: Dockerfile.adapter
    ports:
      - "8003:8003"
    environment:
      - VLLM_RERANK_URL=http://vllm-rerank:8001/v1/score
    depends_on:
      - vllm-rerank
    restart: unless-stopped

  proxy:
    image: nginx:alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - vllm-embed
      - vllm-rerank
      - vllm-chat
      - rerank-adapter
    restart: unless-stopped
