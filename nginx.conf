events {
    worker_connections 1024;
}

http {
    proxy_read_timeout  600s;
    proxy_send_timeout  600s;
    send_timeout        600s;

    proxy_buffering off;
    proxy_request_buffering off;
    proxy_http_version 1.1;

    client_max_body_size 64m;

    upstream vllm-embed {
        server vllm-embed:8000;
        keepalive 32;
    }

    upstream vllm-rerank {
        server vllm-rerank:8001;
        keepalive 32;
    }

    upstream vllm-llm {
        server vllm-llm:8002;
        keepalive 32;
    }

    upstream rerank-adapter {
        server rerank-adapter:8003;
        keepalive 32;
    }

    upstream ocr-service {
        server ocr-service:8004;
        keepalive 8;
    }

    server {
        listen 8080;

        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;

        if ($request_method = OPTIONS) { return 204; }

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Embeddings -> vllm-embed
        location /v1/embeddings {
            proxy_pass http://vllm-embed;
        }

        # Chat completions -> vllm-llm (Agent 1, Agent 3, metadata extraction)
        location /v1/chat/completions {
            proxy_pass http://vllm-llm;
        }

        # Models list -> vllm-llm
        location /v1/models {
            proxy_pass http://vllm-llm;
        }

        # Cohere-format rerank -> rerank-adapter
        location /v2/rerank {
            proxy_pass http://rerank-adapter;
        }

        # Raw vLLM score -> vllm-rerank
        location /v1/score {
            proxy_pass http://vllm-rerank;
        }

        # OCR -> ocr-service (longer timeout: PDF processing is slow)
        location /v1/ocr {
            proxy_pass          http://ocr-service;
            proxy_read_timeout  300s;
        }

        # Proxy health
        location /v1/health { return 200 "ok\n"; }

        location / { return 404; }
    }
}
