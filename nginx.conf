events {
    worker_connections 1024;
}

http {
    proxy_read_timeout  600s;
    proxy_send_timeout  600s;
    send_timeout        600s;

    proxy_buffering off;
    proxy_request_buffering off;
    proxy_http_version 1.1;

    client_max_body_size 32m;

    upstream vllm-embed {
        server vllm-embed:8000;
        keepalive 32;
    }

    upstream vllm-rerank {
        server vllm-rerank:8001;
        keepalive 32;
    }

    upstream vllm-chat {
        server vllm-chat:8002;
        keepalive 32;
    }

    upstream rerank-adapter {
        server rerank-adapter:8003;
        keepalive 32;
    }

    server {
        listen 8080;

        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;

        if ($request_method = OPTIONS) { return 204; }

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Embeddings -> vllm-embed
        location /v1/embeddings {
            proxy_pass http://vllm-embed;
        }

        # Cohere-format rerank -> rerank-adapter
        location /v2/rerank {
            proxy_pass http://rerank-adapter;
        }

        # Raw vLLM score -> vllm-rerank
        location /v1/score {
            proxy_pass http://vllm-rerank;
        }

        # Chat completions -> vllm-chat
        location /v1/chat/completions {
            proxy_pass http://vllm-chat;
        }

        # Legacy completions -> vllm-chat
        location /v1/completions {
            proxy_pass http://vllm-chat;
        }

        # Models list -> vllm-chat
        location /v1/models {
            proxy_pass http://vllm-chat;
        }

        # Proxy health
        location /v1/health { return 200 "ok\n"; }

        location / { return 404; }
    }
}
